name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create cordova_project com.game.speedracer SpeedRacer
          cd cordova_project
          cp -r ../* www/ || true
          
          # HTML file ko index.html mein rename karna taake cordova pick kar le
          cd www
          mv "Speed Racer 3D (1).html" index.html || true
          cd ..

          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SpeedRacer-APK
          path: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
